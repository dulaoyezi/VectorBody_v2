name: Python Web login and report tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'fastapi>=0.115,<1' 'python-multipart>=0.0.9' 'httpx>=0.27,<1' 'pytest>=8,<10' 'numpy==1.26.4' 'opencv-python-headless==4.10.0.84' 'qrcode[pil]>=7.4,<9'
      - name: Syntax checks
        run: |
          python -m compileall -q web_app.py shared_access.py tests/test_web_contract.py
          node --check web/app.js
          node --check web/login.js
      - name: Python API contract and security regression tests
        run: python -m pytest -q tests/test_web_contract.py
